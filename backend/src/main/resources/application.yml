spring:
  application:
    name: iskolarhub
  config:
    # Native development: read ../.env (repo root) when it exists. Real environment variables win.
    import: optional:file:../.env[.properties]
  autoconfigure:
    exclude:
      # No generated default user/password; authentication is implemented explicitly in Phase 4.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Required. Startup fails with "Could not resolve placeholder 'DB_URL'" when missing.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  # Loopback only by default. Containers set SERVER_ADDRESS=0.0.0.0 explicitly.
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

iskolarhub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  pattern:
    # Every log line carries the request correlation id (blank outside a request).
    level: "%5p [%X{requestId:-}]"
